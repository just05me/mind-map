      content="Бесплатно и open source. Схема архитектуры и доска статусов из одних и тех же узлов. Экспорт, импорт из JSON, промпт для ИИ, тёмная тема."

    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('mind-map.landing.theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (_) {}
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
